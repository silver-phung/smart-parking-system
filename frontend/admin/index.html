<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SmartPark Admin - Cổng quản trị bãi xe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/parking-3d-viewer.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#dash"><span class="logo" aria-hidden="true">P</span><span><span id="brandName">SmartPark</span><small>Quản trị bãi xe</small></span></a>
      <nav class="nav" id="nav" aria-label="Điều hướng quản trị"></nav>
      <div class="side-foot"><span class="avatar" id="sideAvatar" aria-hidden="true">BQ</span><span class="grow"><b id="sideName">Ban quản lý</b><small id="sideEmail">Tài khoản demo</small></span><button class="btn icon ghost" type="button" data-act="logout" id="sideLogout" aria-label="Đăng xuất" title="Đăng xuất"></button></div>
    </aside>

    <div class="content">
      <header class="bar">
        <h1 id="pageTitle">Tổng quan</h1>
        <div class="bar-tools">
          <label class="sr" for="lotSel">Chọn bãi xe</label>
          <select id="lotSel"></select>
          <button class="btn sm live-btn" id="simBtn" type="button" data-act="toggleSim"><i class="dot live" id="simDot"></i><span id="simTxt">Trực tiếp</span></button>
          <span class="clock mono" id="clock"></span>
          <button class="btn icon ghost" id="bellBtn" type="button" data-act="goAlerts" aria-label="Cảnh báo"></button>
          <button class="btn icon ghost" id="themeBtn" type="button"></button>
          <button class="btn sm bar-logout" id="logoutBtn" type="button" data-act="logout" aria-label="Đăng xuất" title="Đăng xuất"></button>
        </div>
      </header>
      <main class="page" id="page"></main>
    </div>
  </div>
  <div class="toast" id="toast" hidden role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/parking-3d-viewer.js"></script>
  <script src="admin.js"></script>
</body>
</html>
